<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Market Pulse</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="consent" class="consent hidden">
    <h1>Stay ahead of the market</h1>
    <p>One ping on trading days. Never opens itself.</p>
    <ul>
      <li><b>09:00</b> Pre-market</li>
      <li><b>15:40</b> Market close</li>
    </ul>
    <div class="consent-actions">
      <button id="enableAlerts" type="button" class="primary">Enable alerts</button>
      <button id="notNow" type="button" class="ghost">Not now</button>
    </div>
  </div>

  <header>
    <div class="brand">
      <strong>Market Pulse</strong>
      <span class="ver" id="ver">v1.2.0</span>
      <span id="sess" class="pill">—</span>
    </div>
    <div class="tools">
      <button id="refresh" type="button" title="Refresh">↻</button>
      <button id="dockBtn" type="button" title="Keep on the right (side panel)">◨</button>
      <button id="miniBtn" type="button" title="Mini ticker window">▣</button>
      <button id="settingsBtn" type="button" title="Settings">⚙</button>
    </div>
  </header>

  <div class="strip" id="fii"></div>
  <div class="vix" id="vix"></div>
  <div class="indexes" id="indexes"></div>
  <div class="strip" id="holiday"></div>

  <section class="intel" id="intel"></section>
  <section class="rowline" id="next"></section>
  <section class="rowline" id="risk"></section>
  <div id="allEvents" class="all hidden"></div>

  <footer id="meta"></footer>

  <div id="settings" class="sheet hidden">
    <h2>Settings</h2>
    <label class="toggle"><input id="alertToggle" type="checkbox" /> 09:00 / 15:40 alerts</label>
    <a href="options.html" target="_blank" rel="noreferrer">Admin JSON</a>
    <a id="suggest" target="_blank" rel="noreferrer">Suggest a feature</a>
    <a id="badData" target="_blank" rel="noreferrer">Report incorrect data</a>
    <a id="problem" target="_blank" rel="noreferrer">Report a problem</a>
    <p class="ver">Market Pulse <span id="ver2">v1.2.0</span></p>
    <button id="closeSheet" type="button" class="ghost">Close</button>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
